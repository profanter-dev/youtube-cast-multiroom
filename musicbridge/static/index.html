<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Multiroom" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<title>Multiroom</title>
<style>
  :root {
    --bg:#0a0a0f; --surface:#14141c; --surface2:#1d1d27; --surface3:#272733;
    --line:rgba(255,255,255,.07); --txt:#f4f4f7; --dim:#9d9dad; --faint:#6b6b7b;
    --accent:#ff3d5a; --accent2:#ff7a45; --ok:#34d399; --bad:#f87171; --warn:#fbbf24;
    --tabbar:64px; --mini:64px;
    --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px);
    --grad:linear-gradient(135deg, var(--accent), var(--accent2));
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg);
         color:var(--txt); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  svg { display:block; }
  .wrap { max-width:760px; margin:0 auto; }

  /* --- app bar --- */
  .appbar { position:sticky; top:0; z-index:10; padding:calc(10px + var(--safe-t)) 16px 10px;
            background:rgba(10,10,15,.78); backdrop-filter:saturate(180%) blur(20px);
            -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid transparent;
            transition:border-color .2s; }
  .appbar.scrolled { border-bottom-color:var(--line); }
  .bar-row { display:flex; align-items:center; gap:8px; min-height:40px; }
  .bar-row h1 { flex:1; margin:0; font-size:26px; font-weight:750; letter-spacing:-.02em;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .iconbtn { width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
             color:var(--txt); flex:0 0 auto; position:relative; transition:background .15s, transform .1s; }
  .iconbtn:active { background:var(--surface2); transform:scale(.94); }
  #backBtn { margin-left:-8px; display:none; }
  #backBtn.show { display:grid; }
  .dot { position:absolute; right:6px; top:6px; width:10px; height:10px; border-radius:50%;
         border:2px solid var(--bg); background:var(--faint); }
  .dot.ok { background:var(--ok); } .dot.expired { background:var(--bad); } .dot.unknown { background:var(--warn); }
  .searchbox { position:relative; margin-top:10px; display:none; }
  .searchbox.show { display:block; }
  .searchbox svg.lead { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--dim); }
  #search { width:100%; height:44px; padding:0 40px 0 42px; border-radius:14px; border:1px solid var(--line);
            font-size:16px; background:var(--surface); color:var(--txt); outline:none; transition:border-color .15s; }
  #search:focus { border-color:rgba(255,61,90,.55); }
  #search::-webkit-search-cancel-button { display:none; }
  #clearSearch { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:32px; height:32px;
                 border-radius:50%; display:none; place-items:center; color:var(--dim); }
  #clearSearch.show { display:grid; }

  /* --- content --- */
  main { padding:4px 8px calc(var(--tabbar) + var(--safe-b) + 24px); min-height:60vh; }
  body.has-mini main { padding-bottom:calc(var(--tabbar) + var(--mini) + var(--safe-b) + 32px); }
  .hint { color:var(--dim); font-size:14px; padding:56px 24px; text-align:center; line-height:1.5; }
  .hint svg { margin:0 auto 14px; color:var(--faint); }
  .hint .pill { margin-top:16px; }
  .actions { display:flex; gap:10px; padding:8px 8px 12px; }
  .pill { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:42px; padding:0 18px;
          border-radius:21px; font-size:15px; font-weight:600; background:var(--surface2); color:var(--txt);
          transition:transform .1s, filter .15s; white-space:nowrap; }
  .pill:active { transform:scale(.96); }
  .pill.primary { background:var(--grad); color:#fff; box-shadow:0 6px 18px rgba(255,61,90,.28); }
  .pill.small { height:32px; padding:0 12px; font-size:13px; border-radius:16px; }
  .actions .pill { flex:1; }
  .section { display:flex; align-items:center; justify-content:space-between; padding:18px 8px 6px; }
  .section h2 { margin:0; font-size:13px; font-weight:650; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }

  /* track rows */
  .row { display:flex; align-items:center; gap:12px; padding:7px 8px; border-radius:12px; cursor:pointer;
         transition:background .12s; }
  .row:active { background:var(--surface); }
  @media (hover:hover) { .row:hover { background:var(--surface); } }
  .art { width:50px; height:50px; border-radius:8px; object-fit:cover; background:var(--surface2); flex:0 0 auto; }
  .artwrap { position:relative; flex:0 0 auto; }
  .eq { position:absolute; inset:0; border-radius:8px; background:rgba(0,0,0,.55); display:none;
        align-items:flex-end; justify-content:center; gap:3px; padding:14px 0; }
  .row.playing .eq { display:flex; }
  .eq i { width:3px; background:var(--accent); border-radius:2px; animation:eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay:-.4s; } .eq i:nth-child(3) { animation-delay:-.7s; }
  body.paused .eq i { animation-play-state:paused; }
  @keyframes eq { 0%,100% { height:5px; } 50% { height:20px; } }
  .meta { flex:1; min-width:0; }
  .meta .t { font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.playing .meta .t { color:var(--accent); }
  .meta .a { font-size:13px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rowbtn { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--dim); flex:0 0 auto; }
  .rowbtn:active { background:var(--surface2); color:var(--txt); }
  .rowbtn.done { color:var(--ok); }

  /* playlist grid */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(148px, 1fr)); gap:16px 14px; padding:8px; }
  .card { cursor:pointer; min-width:0; transition:transform .12s; }
  .card:active { transform:scale(.97); }
  .card .cover { width:100%; aspect-ratio:1; border-radius:14px; object-fit:cover; background:var(--surface2);
                 box-shadow:0 8px 24px rgba(0,0,0,.35); display:block; }
  .card .t { font-size:14px; font-weight:600; margin-top:8px; display:-webkit-box; -webkit-line-clamp:2;
             -webkit-box-orient:vertical; overflow:hidden; line-height:1.3; }

  /* playlist hero */
  .hero { position:relative; isolation:isolate; margin:0 -8px 4px; padding:18px 16px 4px; display:flex; flex-direction:column;
          align-items:center; text-align:center; overflow:hidden; }
  .hero .bgimg { position:absolute; inset:-40px; background-size:cover; background-position:center;
                 filter:blur(40px) saturate(1.4); opacity:.35; z-index:-1; }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 30%, var(--bg)); z-index:-1; }
  .hero .cover { width:min(56vw, 220px); aspect-ratio:1; border-radius:16px; object-fit:cover;
                 background:var(--surface2); box-shadow:0 18px 48px rgba(0,0,0,.55); }
  .hero h2 { font-size:22px; margin:16px 0 4px; letter-spacing:-.01em; }
  .hero .sub { color:var(--dim); font-size:13px; }
  .hero .actions { width:100%; max-width:420px; padding:16px 0 4px; }

  /* skeletons */
  .sk { background:linear-gradient(90deg, var(--surface) 0%, var(--surface2) 50%, var(--surface) 100%);
        background-size:200% 100%; animation:sk 1.2s linear infinite; border-radius:8px; }
  @keyframes sk { to { background-position:-200% 0; } }
  .skrow { display:flex; gap:12px; align-items:center; padding:7px 8px; }
  .skrow .sk.a { width:50px; height:50px; flex:0 0 auto; }
  .skrow .l { flex:1; } .skrow .l .sk { height:12px; margin:6px 0; }

  /* --- mini player --- */
  #mini { position:fixed; left:8px; right:8px; bottom:calc(var(--tabbar) + var(--safe-b) + 8px); z-index:20;
          max-width:744px; margin:0 auto; height:var(--mini); border-radius:16px; display:none;
          align-items:center; gap:12px; padding:0 8px 0 8px; overflow:hidden; cursor:pointer;
          background:rgba(36,36,48,.86); backdrop-filter:saturate(180%) blur(24px);
          -webkit-backdrop-filter:saturate(180%) blur(24px); box-shadow:0 10px 30px rgba(0,0,0,.45);
          border:1px solid var(--line); }
  body.has-mini #mini { display:flex; }
  #mini .art { width:46px; height:46px; }
  #mini .meta .t { font-size:14px; } #mini .meta .a { font-size:12px; }
  #mini .mprog { position:absolute; left:12px; right:12px; bottom:0; height:2px; background:rgba(255,255,255,.12); border-radius:1px; overflow:hidden; }
  #mini .mprog i { display:block; height:100%; width:0; background:var(--txt); }
  .mbtn { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; }
  .mbtn:active { background:rgba(255,255,255,.08); }

  /* --- tab bar --- */
  nav.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:21; padding-bottom:var(--safe-b);
               background:rgba(14,14,20,.9); backdrop-filter:saturate(180%) blur(24px);
               -webkit-backdrop-filter:saturate(180%) blur(24px); border-top:1px solid var(--line); }
  nav.tabbar .wrap { display:flex; height:var(--tabbar); }
  nav.tabbar button { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
                      color:var(--faint); font-size:11px; font-weight:600; transition:color .15s; position:relative; }
  nav.tabbar button.active { color:var(--txt); }
  nav.tabbar button.active svg { color:var(--accent); }
  nav.tabbar button:active svg { transform:scale(.9); }
  .badge { position:absolute; top:7px; left:calc(50% + 6px); min-width:17px; height:17px; padding:0 5px;
           border-radius:9px; background:var(--accent); color:#fff; font-size:10px; font-weight:700;
           display:none; align-items:center; justify-content:center; }
  .badge.show { display:flex; }

  /* --- sheets --- */
  .scrim { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.55); opacity:0; pointer-events:none;
           transition:opacity .25s; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:560px; margin:0 auto;
           background:var(--surface); border-radius:22px 22px 0 0; padding:8px 20px calc(20px + var(--safe-b));
           transform:translateY(105%); transition:transform .32s cubic-bezier(.2,.9,.25,1);
           max-height:88vh; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.4); }
  .sheet.show { transform:none; }
  .grab { width:38px; height:5px; border-radius:3px; background:var(--surface3); margin:4px auto 14px; }
  .sheet h2 { margin:0 0 6px; font-size:20px; letter-spacing:-.01em; }
  .sheet p { color:var(--dim); font-size:14px; line-height:1.55; margin:8px 0; }
  .sheet b { color:var(--txt); }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:48px;
         border-radius:14px; font-size:15px; font-weight:600; margin-top:10px; background:var(--surface2);
         color:var(--txt); text-decoration:none; transition:transform .1s; cursor:pointer; }
  .btn:active { transform:scale(.98); }
  .btn.primary { background:var(--grad); color:#fff; }
  .btn.danger { background:none; color:var(--bad); }
  .btn.ghost { background:none; color:var(--dim); }
  .status { display:flex; gap:14px; align-items:center; background:var(--surface2); border-radius:16px; padding:14px 16px; margin:10px 0 6px; }
  .status .sdot { width:12px; height:12px; border-radius:50%; flex:0 0 auto; background:var(--faint);
                  box-shadow:0 0 0 4px rgba(255,255,255,.05); }
  .status.ok .sdot { background:var(--ok); box-shadow:0 0 0 4px rgba(52,211,153,.15); }
  .status.expired .sdot { background:var(--bad); box-shadow:0 0 0 4px rgba(248,113,113,.15); }
  .status.unknown .sdot { background:var(--warn); box-shadow:0 0 0 4px rgba(251,191,36,.15); }
  .status .st { font-weight:650; font-size:15px; } .status .ss { color:var(--dim); font-size:13px; margin-top:2px; }
  dl.facts { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; margin:14px 2px 6px; font-size:14px; }
  dl.facts dt { color:var(--dim); } dl.facts dd { margin:0; text-align:right; }
  details.howto { margin-top:12px; background:var(--surface2); border-radius:14px; padding:2px 16px; }
  details.howto summary { cursor:pointer; font-weight:600; font-size:14px; padding:12px 0; list-style:none; }
  details.howto summary::-webkit-details-marker { display:none; }
  details.howto ol { margin:0 0 12px; padding-left:20px; color:var(--dim); font-size:14px; line-height:1.6; }
  #authMsg { min-height:1.2em; }

  /* volume */
  .vrow { display:flex; align-items:center; gap:12px; margin:16px 0; }
  .vrow .vn { flex:0 0 104px; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vrow .vp { flex:0 0 40px; text-align:right; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .vrow.off { opacity:.4; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; min-width:0; height:6px; border-radius:3px;
                      background:linear-gradient(to right, var(--txt) var(--p,50%), var(--surface3) var(--p,50%)); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-thumb { width:20px; height:20px; border:0; border-radius:50%; background:#fff; }
  hr.sep { border:0; border-top:1px solid var(--line); margin:4px 0; }

  /* --- full-screen player --- */
  #player { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column;
            padding:calc(10px + var(--safe-t)) 24px calc(24px + var(--safe-b)); transform:translateY(100%);
            transition:transform .38s cubic-bezier(.2,.9,.25,1); overflow:hidden; }
  #player.show { transform:none; }
  #player .bgimg { position:absolute; inset:-80px; background-size:cover; background-position:center;
                   filter:blur(60px) saturate(1.5); opacity:.45; z-index:-1; transition:background-image .4s; }
  #player::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(rgba(10,10,15,.2), rgba(10,10,15,.85) 70%); }
  .ptop { display:flex; align-items:center; justify-content:space-between; }
  .ptop .lbl { font-size:12px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .pbody { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:460px; width:100%; margin:0 auto; min-height:0; }
  .bigart { width:100%; max-height:46vh; aspect-ratio:1; object-fit:cover; border-radius:20px; background:var(--surface2);
            box-shadow:0 24px 60px rgba(0,0,0,.6); align-self:center; transition:transform .3s; }
  #player.paused .bigart { transform:scale(.92); }
  .ptitle { margin-top:28px; display:flex; align-items:center; gap:12px; }
  .ptitle .meta .t { font-size:22px; font-weight:700; letter-spacing:-.01em; }
  .ptitle .meta .a { font-size:16px; margin-top:4px; }
  .pprog { margin-top:22px; }
  .pbar { height:5px; border-radius:3px; background:rgba(255,255,255,.15); overflow:hidden; }
  .pbar i { display:block; height:100%; width:0; background:var(--txt); border-radius:3px; }
  .ptimes { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:8px; font-variant-numeric:tabular-nums; }
  .ctrls { display:flex; align-items:center; justify-content:space-between; margin-top:18px; }
  .ctrls button { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; transition:transform .1s, color .15s; }
  .ctrls button:active { transform:scale(.9); }
  .ctrls .toggle { color:var(--dim); } .ctrls .toggle.on { color:var(--accent); }
  .ctrls .play { width:76px; height:76px; background:var(--txt); color:var(--bg); box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .ctrls .play.is-play svg { transform:translateX(2px); }
  .ctrls.busy button { pointer-events:none; }
  .ctrls.busy .toggle, .ctrls.busy #prev, .ctrls.busy #next { opacity:.4; }
  .pfoot { display:flex; justify-content:space-between; margin-top:26px; }
  .pfoot button { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:14px; font-weight:600; padding:10px 12px; border-radius:12px; }
  .pfoot button:active { background:rgba(255,255,255,.06); color:var(--txt); }
  .spinner { width:24px; height:24px; border:3px solid currentColor; border-top-color:transparent; border-radius:50%;
             animation:spin .7s linear infinite; opacity:.8; }
  .mbtn .spinner { width:20px; height:20px; border-width:2.5px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* toast */
  #toast { position:fixed; left:50%; bottom:calc(var(--tabbar) + var(--safe-b) + 18px); z-index:60;
           transform:translate(-50%, 20px); opacity:0; pointer-events:none; transition:all .25s;
           background:var(--txt); color:var(--bg); font-size:14px; font-weight:600; padding:10px 18px; border-radius:20px;
           box-shadow:0 8px 24px rgba(0,0,0,.4); white-space:nowrap; }
  body.has-mini #toast { bottom:calc(var(--tabbar) + var(--mini) + var(--safe-b) + 22px); }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<header class="appbar" id="appbar"><div class="wrap">
  <div class="bar-row">
    <button class="iconbtn" id="backBtn" aria-label="Back"></button>
    <h1 id="title">Search</h1>
    <button class="iconbtn" id="account" aria-label="Account"><span class="dot" id="acctDot"></span></button>
  </div>
  <div class="searchbox" id="searchbox">
    <span class="lead-wrap"></span>
    <input id="search" type="search" placeholder="Songs, artists, albums" autocomplete="off" enterkeyhint="search" />
    <button id="clearSearch" aria-label="Clear"></button>
  </div>
</div></header>

<main class="wrap" id="view"></main>

<div id="mini" role="button" aria-label="Open player">
  <img class="art" id="mini-img" alt="" />
  <div class="meta"><div class="t" id="mini-title">—</div><div class="a" id="mini-artist"></div></div>
  <button class="mbtn" id="mini-pp" aria-label="Play/Pause"></button>
  <button class="mbtn" id="mini-next" aria-label="Next"></button>
  <div class="mprog"><i id="mini-fill"></i></div>
</div>

<nav class="tabbar"><div class="wrap" id="tabs">
  <button data-tab="search"></button>
  <button data-tab="library"></button>
  <button data-tab="playlists"></button>
  <button data-tab="queue"></button>
</div></nav>

<section id="player" aria-label="Now playing">
  <div class="bgimg" id="p-bg"></div>
  <div class="ptop">
    <button class="iconbtn" id="p-close" aria-label="Close"></button>
    <span class="lbl">Now playing</span>
    <button class="iconbtn" id="p-vol" aria-label="Volume"></button>
  </div>
  <div class="pbody">
    <img class="bigart" id="p-img" alt="" />
    <div class="ptitle"><div class="meta"><div class="t" id="p-title">—</div><div class="a" id="p-artist"></div></div></div>
    <div class="pprog">
      <div class="pbar"><i id="p-fill"></i></div>
      <div class="ptimes"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
    </div>
    <div class="ctrls" id="ctrls">
      <button id="shuffle" class="toggle" aria-label="Shuffle"></button>
      <button id="prev" aria-label="Previous"></button>
      <button id="playpause" class="play" aria-label="Play/Pause"></button>
      <button id="next" aria-label="Next"></button>
      <button id="repeat" class="toggle" aria-label="Repeat"></button>
    </div>
    <div class="pfoot">
      <button id="p-stop"></button>
      <button id="p-queue"></button>
    </div>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="authSheet"></div>
<div class="sheet" id="volSheet"></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const view = $("#view");
const TABS = ["search", "library", "playlists", "queue"];
const TAB_TITLE = { search: "Search", library: "Liked", playlists: "Playlists", queue: "Queue" };

// ---------------------------------------------------------------- icons ---
const stroke = (b, s = 24, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const fill = (b, s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor">${b}</svg>`;
const P = {
  search: `<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>`,
  heart: `<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>`,

// ---------------------------------------------------------------- helpers ---
async function api(path, opts) {
  const r = await fetch("/api/" + path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}
const post = (path, body) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: body ? JSON.stringify(body) : null,
});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
// YouTube Music thumbnails come at ~60px; their URLs take a size suffix, so ask
// for a sharp one wherever art is shown big.
const big = (u, px = 544) => (u || "").replace(/=w\d+-h\d+/, `=w${px}-h${px}`);
const fmt = s => { s = Math.max(0, s | 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600);
}
const skeleton = (n = 8) => Array.from({ length: n }, () =>
  `<div class="skrow"><div class="sk a"></div><div class="l"><div class="sk" style="width:${55 + Math.random() * 35}%"></div><div class="sk" style="width:${25 + Math.random() * 25}%"></div></div></div>`).join("");
const hint = (icon, msg, extra = "") => `<div class="hint">${stroke(icon, 44, 1.5)}${msg}${extra}</div>`;

// ---------------------------------------------------------------- routing ---
// The URL is the source of truth for the tab, the search and the open playlist,
// so a reload lands you in the same spot (scroll included) and the phone's Back
// button walks out of a playlist — or closes a sheet — instead of leaving.
//
// Invariant: only user-event handlers write history (go / the search debounce /
// reload / sheets / bootstrap). Render functions never do — that's what stops a
// popstate-driven re-render from pushing entries in an endless loop.
let tab = "search", curPl = null, navToken = 0, seq = 0, rendered = null;

function urlFor() {
  const p = new URLSearchParams();
  p.set("tab", tab);
  if (tab === "search") { const q = $("#search").value.trim(); if (q) p.set("q", q); }
  if (tab === "playlists" && curPl) p.set("pl", curPl);
  return "?" + p;
}
function writeUrl(push) {
  const u = urlFor();
  if (u === location.search) return;
  if (push) history.pushState({ seq: ++seq }, "", u);
  else history.replaceState(history.state, "", u);
}
function readUrl() {
  const p = new URLSearchParams(location.search);
  const t = p.get("tab");
  tab = TABS.includes(t) ? t : "search";
  curPl = tab === "playlists" ? (p.get("pl") || null) : null;
  const q = tab === "search" ? (p.get("q") || "") : "";
  if ($("#search").value !== q) $("#search").value = q;
}

// Scroll position per URL (sessionStorage survives a reload), restored once the
// async content for that URL has rendered.
const SCROLL_KEY = "mb-scroll";
const scrolls = JSON.parse(sessionStorage.getItem(SCROLL_KEY) || "{}");
let restoreFor = null;
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
let scrollT;
addEventListener("scroll", () => {
  $("#appbar").classList.toggle("scrolled", scrollY > 4);
  if (restoreFor || !rendered) return;             // don't record while restoring
  scrolls[rendered] = Math.round(scrollY);         // key = the view being scrolled
  clearTimeout(scrollT);
  scrollT = setTimeout(() => sessionStorage.setItem(SCROLL_KEY, JSON.stringify(scrolls)), 150);
}, { passive: true });
addEventListener("pagehide", () => {               // reload / app switch: save now
  if (!restoreFor && rendered) {
    scrolls[rendered] = Math.round(scrollY);
    sessionStorage.setItem(SCROLL_KEY, JSON.stringify(scrolls));
  }
});
function restoreScroll() {
  if (restoreFor !== location.search) return;
  restoreFor = null;
  scrollTo(0, scrolls[location.search] || 0);
}

function syncChrome() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  $("#searchbox").classList.toggle("show", tab === "search");
  $("#clearSearch").classList.toggle("show", !!$("#search").value);
  $("#backBtn").classList.toggle("show", tab === "playlists" && !!curPl);
  if (!(tab === "playlists" && curPl)) $("#title").textContent = TAB_TITLE[tab];
  document.title = (curPl ? "Playlist" : TAB_TITLE[tab]) + " · Multiroom";
}

function applyRoute() {
  readUrl();
  clearTimeout(timer);
  syncChrome();
  rendered = location.search;
  restoreFor = location.search;
  scrollTo(0, 0);
  const my = ++navToken;
  if (tab === "search") return runSearch($("#search").value.trim(), my, true);
  if (tab === "playlists" && curPl) return openPlaylist(curPl, my);
  return loadTab(my);
}
function go(next) {
  if (next.tab !== undefined) tab = next.tab;
  if (next.pl !== undefined) curPl = next.pl;
  writeUrl(true);
  applyRoute();
}
function reload() { curPl = null; writeUrl(false); applyRoute(); }

addEventListener("popstate", () => {
  const hadSheet = closeAllSheets();
  const then = afterClose; afterClose = null;
  if (then) return then();
  if (hadSheet && location.search === rendered) return;   // Back just closed a sheet
  applyRoute();
});

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  if (b.dataset.tab === tab && !curPl) { scrollTo({ top: 0, behavior: "smooth" }); return; }
  go({ tab: b.dataset.tab, pl: null });
});
$("#backBtn").onclick = backToPlaylists;

// ---------------------------------------------------------------- lists ---
let lastTracks = [];

function trackRows(tracks, { removable = false } = {}) {
  const box = document.createElement("div");
  tracks.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "row" + (t.videoId === npVid ? " playing" : "");
    row.dataset.vid = t.videoId;
    const sub = [t.artist, t.duration ? fmt(t.duration) : ""].filter(Boolean).join(" · ");
    row.innerHTML = `
      <div class="artwrap"><img class="art" loading="lazy" src="${esc(t.thumb || "")}" alt="" /><div class="eq"><i></i><i></i><i></i></div></div>
      <div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(sub)}</div></div>
      <button class="rowbtn" aria-label="${removable ? "Remove" : "Add to queue"}">${stroke(removable ? P.x : P.plus, 20)}</button>`;
    const btn = row.querySelector(".rowbtn");
    if (removable) {
      row.onclick = null;
      btn.onclick = async e => { e.stopPropagation(); renderQueue(await post("queue/remove", { index: i })); };
    } else {
      row.onclick = () => play("play", t);
      btn.onclick = e => {
        e.stopPropagation(); post("queue", t).then(applyStatus).catch(() => {});
        btn.classList.add("done"); btn.innerHTML = stroke(P.check, 20); toast("Added to queue");
        setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = stroke(P.plus, 20); }, 900);
      };
    }
    box.appendChild(row);
  });
  return box;
}

function playActions(tracks) {
  const a = document.createElement("div");
  a.className = "actions";
  a.innerHTML = `<button class="pill primary">${I.playS}<span>Play</span></button>
                 <button class="pill">${stroke(P.shuffle, 18)}<span>Shuffle</span></button>`;
  const [p, s] = a.querySelectorAll("button");
  p.onclick = () => play("play_tracks", { tracks, shuffle: false });
  s.onclick = () => play("play_tracks", { tracks, shuffle: true });
  return a;
}

function renderList(tracks, empty) {
  lastTracks = tracks;
  view.innerHTML = "";
  if (!tracks.length) { view.innerHTML = empty; return; }
  view.append(playActions(tracks), trackRows(tracks));
}

// Library / playlists without a working cookie: say why instead of an API error.
function authHint() {
  if (authMethod === "none")
    return hint(P.user, "Connect your YouTube Music account to see your library and playlists.", connectBtn);
  if (cookie.status === "expired")
    return hint(P.user, "Your YouTube Music cookie has expired. Upload a fresh one to see your library.",
      `<br><button class="pill primary" onclick="openAuth()">${stroke(P.upload, 18)}<span>Replace cookie</span></button>`);
  return "";
}
const connectBtn = `<br><button class="pill primary" onclick="openAuth()">${stroke(P.user, 18)}<span>Connect account</span></button>`;

async function loadTab(token = navToken) {
  view.innerHTML = tab === "playlists" ? `<div class="grid">${Array.from({ length: 6 }, () => `<div><div class="sk" style="aspect-ratio:1;border-radius:14px"></div><div class="sk" style="height:12px;margin-top:10px;width:70%"></div></div>`).join("")}</div>` : skeleton();
  try {
    if (tab === "library") {
      const songs = await api("library");
      if (token !== navToken) return;
      renderList(songs, authHint() || hint(P.heart, "No liked songs yet."));
    } else if (tab === "playlists") {
      const pls = await api("playlists");
      if (token !== navToken) return;
      renderPlaylists(pls);
    } else if (tab === "queue") {
      const s = await api("status");
      if (token !== navToken) return;
      renderQueue(s);
    }
  } catch (e) {
    if (token === navToken) view.innerHTML = authHint() || hint(P.user, esc(e.message), connectBtn);
  }
  if (token === navToken) restoreScroll();
}

function renderPlaylists(pls) {
  if (!pls.length) { view.innerHTML = authHint() || hint(P.lib, "No playlists yet."); return; }
  const g = document.createElement("div");
  g.className = "grid";
  pls.forEach(p => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<img class="cover" loading="lazy" src="${esc(big(p.thumb, 360))}" alt="" /><div class="t">${esc(p.title)}</div>`;
    c.onclick = () => go({ pl: p.playlistId });
    g.appendChild(c);
  });
  view.innerHTML = "";
  view.appendChild(g);
}

// ?pl= must open a playlist cold, with only the id — /api/playlist/<id> returns
// its title and tracks.
async function openPlaylist(id, token) {
  $("#title").textContent = "";
  view.innerHTML = `<div class="hero"><div class="sk cover"></div><div class="sk" style="height:18px;width:50%;margin-top:18px"></div></div>` + skeleton(6);
  try {
    const data = await api("playlist/" + encodeURIComponent(id));
    if (token !== navToken) return;
    lastTracks = data.tracks;
    const cover = big((data.tracks[0] || {}).thumb);
    const total = data.tracks.reduce((a, t) => a + (t.duration || 0), 0);
    $("#title").textContent = data.title || "Playlist";
    document.title = (data.title || "Playlist") + " · Multiroom";
    view.innerHTML = `<div class="hero"><div class="bgimg" style="background-image:url('${esc(cover)}')"></div>
      <img class="cover" src="${esc(cover)}" alt="" /><h2>${esc(data.title || "Playlist")}</h2>
      <div class="sub">${data.tracks.length} songs${total ? " · " + Math.round(total / 60) + " min" : ""}</div></div>`;
    if (data.tracks.length) {
      view.querySelector(".hero").appendChild(playActions(data.tracks));
      view.appendChild(trackRows(data.tracks));
    } else view.insertAdjacentHTML("beforeend", hint(P.music, "This playlist is empty."));
  } catch (e) {
    if (token !== navToken) return;
    $("#title").textContent = "Playlist";
    view.innerHTML = hint(P.lib, esc(e.message));
  }
  if (token === navToken) restoreScroll();
}

function backToPlaylists() {
  // state.seq is only on entries this page pushed. Without one — a reload or a
  // shared link straight into ?pl= — history.back() would leave the site.
  if (history.state && history.state.seq) history.back();
  else { curPl = null; writeUrl(false); applyRoute(); }
}

function renderQueue(s) {
  const items = s.queue || [];
  view.innerHTML = "";
  if (s.current) {
    view.insertAdjacentHTML("beforeend", `<div class="section"><h2>Now playing</h2></div>`);
    const cur = trackRows([s.current]);
    cur.firstChild.onclick = () => openPlayer();
    cur.firstChild.querySelector(".rowbtn").remove();
    view.appendChild(cur);
  }
  if (!items.length) {
    if (!s.current) view.innerHTML = hint(P.queue, "Nothing queued.<br>Tap <b>+</b> on a song, or play a playlist.");
    else view.insertAdjacentHTML("beforeend", `<div class="hint" style="padding:28px">Nothing up next.</div>`);
    return;
  }
  const sec = document.createElement("div");
  sec.className = "section";
  sec.innerHTML = `<h2>Up next · ${items.length}</h2><button class="pill small">${stroke(P.trash, 15)}<span>Clear</span></button>`;
  sec.querySelector("button").onclick = async () => renderQueue(await post("queue/clear"));
  view.appendChild(sec);
  view.appendChild(trackRows(items, { removable: true }));
}

// ---------------------------------------------------------------- search ---
async function runSearch(q, token, fromRoute) {
  if (!q) {
    lastTracks = [];
    view.innerHTML = hint(P.search, "Search YouTube Music for songs and artists.");
    if (fromRoute) restoreScroll();
    return;
  }
  if (fromRoute) view.innerHTML = skeleton();
  try {
    const songs = await api("search?q=" + encodeURIComponent(q));
    if (token !== navToken) return;
    renderList(songs, hint(P.search, `No results for “${esc(q)}”.`));
  } catch (err) { if (token === navToken) view.innerHTML = hint(P.search, esc(err.message)); }
  if (fromRoute && token === navToken) restoreScroll();
}

let timer;
$("#search").addEventListener("input", e => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  const my = ++navToken;
  $("#clearSearch").classList.toggle("show", !!e.target.value);
  // Typing only replaces the entry, so one Back leaves the search, not 20 keystrokes.
  if (!q) { writeUrl(false); rendered = location.search; runSearch("", my); return; }
  timer = setTimeout(() => { writeUrl(false); rendered = location.search; runSearch(q, my); }, 350);
});
$("#search").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("#clearSearch").onclick = () => {
  const s = $("#search"); s.value = ""; s.dispatchEvent(new Event("input")); s.focus();
};

// ---------------------------------------------------------------- sheets ---
// Every sheet (player, account, volume) pushes a history entry with the same URL,
// so the phone's Back button closes it; closing it in the UI pops that entry.
const sheets = { player: $("#player"), auth: $("#authSheet"), vol: $("#volSheet") };
let openSheet = null, afterClose = null;
function showSheet(name) {
  if (openSheet === name) return;
  if (openSheet) hideSheetEl(openSheet);
  else history.pushState({ seq: ++seq, sheet: true }, "", location.search);
  openSheet = name;
  sheets[name].classList.add("show");
  if (name !== "player") $("#scrim").classList.add("show");
}
function hideSheetEl(name) {
  sheets[name].classList.remove("show");
  $("#scrim").classList.remove("show");
}
// `then` runs once the sheet's history entry is gone — navigating before that
// would race history.back().
function closeSheet(then) {
  if (!openSheet) { if (typeof then === "function") then(); return; }
  if (history.state && history.state.sheet) {
    afterClose = typeof then === "function" ? then : null;
    history.back();                                             // popstate hides it
  } else { closeAllSheets(); if (typeof then === "function") then(); }
}
function closeAllSheets() {
  if (!openSheet) return false;
  hideSheetEl(openSheet);
  openSheet = null;
  return true;
}
$("#scrim").onclick = () => closeSheet();
addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// Drag a sheet (or the player) down to dismiss.
function dragToClose(el, handleSel) {
  let y0 = null, dy = 0;
  el.addEventListener("touchstart", e => {
    if (handleSel && !e.target.closest(handleSel)) return;
    if (el.scrollTop > 0) return;
    y0 = e.touches[0].clientY; dy = 0; el.style.transition = "none";
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    el.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  el.addEventListener("touchend", () => {
    if (y0 === null) return;
    el.style.transition = ""; el.style.transform = "";
    if (dy > 110) closeSheet();
    y0 = null;
  });
}
dragToClose($("#authSheet"));
dragToClose($("#volSheet"));
dragToClose($("#player"), ".ptop, .bigart, .ptitle");

// ---------------------------------------------------------------- player ---
let paused = false, shuffle = false, repeat = "off", playing = false;
let npDur = 0, npVid = null, anchorElapsed = 0, anchorTime = 0;
let busy = false, loadingTrack = false;

function openPlayer() { if (playing) showSheet("player"); }
$("#mini").onclick = e => { if (!e.target.closest(".mbtn")) openPlayer(); };
$("#p-close").onclick = () => closeSheet();
$("#p-vol").onclick = () => openVol();
$("#p-queue").onclick = () => closeSheet(() => go({ tab: "queue", pl: null }));
$("#p-stop").onclick = () => { action("stop"); closeSheet(); };
$("#prev").onclick = () => action("prev", null, true);
$("#next").onclick = () => action("next", null, true);
$("#mini-next").onclick = () => action("next", null, true);
$("#playpause").onclick = $("#mini-pp").onclick = () => action(paused ? "resume" : "pause");
$("#shuffle").onclick = () => action("shuffle", { on: !shuffle });
$("#repeat").onclick = () => action("repeat", { mode: { off: "all", all: "one", one: "off" }[repeat] || "off" });

function displayedElapsed() {
  let cur = paused ? anchorElapsed : anchorElapsed + (performance.now() - anchorTime) / 1000;
  if (npDur) cur = Math.min(cur, npDur);
  return Math.max(0, cur);
}
function renderProgress() {
  if (!playing) return;
  const cur = displayedElapsed();
  const pct = npDur ? Math.min(100, cur / npDur * 100) + "%" : "0%";
  $("#t-cur").textContent = fmt(cur);
  $("#p-fill").style.width = pct;
  $("#mini-fill").style.width = pct;
}
setInterval(renderProgress, 250);

function syncProgress(s) {
  const trackChanged = s.current.videoId !== npVid;
  npDur = s.current.duration || 0;
  const wasPaused = paused;
  paused = s.paused;
  const predicted = displayedElapsed();
  const serverEl = s.elapsed || 0;
  if (trackChanged || paused !== wasPaused || !anchorTime || Math.abs(serverEl - predicted) > 1) {
    anchorElapsed = serverEl; anchorTime = performance.now();
  }
}

function updatePlayButton() {
  const pp = $("#playpause"), mp = $("#mini-pp");
  if (busy || (playing && loadingTrack)) {
    pp.classList.remove("is-play");
    if (!pp.querySelector(".spinner")) pp.innerHTML = '<span class="spinner"></span>';
    if (!mp.querySelector(".spinner")) mp.innerHTML = '<span class="spinner"></span>';
  } else {
    pp.innerHTML = paused ? I.play : I.pause;
    pp.classList.toggle("is-play", paused);
    mp.innerHTML = paused ? I.playS : I.pauseS;
  }
  $("#player").classList.toggle("paused", paused);
  document.body.classList.toggle("paused", paused);
}

function markPlaying() {
  document.querySelectorAll(".row[data-vid]").forEach(r => r.classList.toggle("playing", r.dataset.vid === npVid));
}

let lastQueueSig = "";
function applyStatus(s) {
  if (!s || typeof s !== "object") return;
  shuffle = s.shuffle; repeat = s.repeat;
  loadingTrack = !!s.loading;
  $("#shuffle").classList.toggle("on", shuffle);
  const rb = $("#repeat");
  rb.classList.toggle("on", repeat !== "off");
  rb.innerHTML = stroke(P.repeat + (repeat === "one" ? `<path d="M11 10h1v4"/>` : ""), 22);
  const qn = (s.queue || []).length, badge = $("#qbadge");
  badge.textContent = qn > 99 ? "99+" : qn; badge.classList.toggle("show", qn > 0);

  const wasPlaying = playing;
  playing = !!s.current;
  document.body.classList.toggle("has-mini", playing);
  if (s.current) {
    const c = s.current;
    if (c.videoId !== npVid) {
      $("#mini-img").src = big(c.thumb, 120);
      $("#p-img").src = big(c.thumb);
      $("#p-bg").style.backgroundImage = c.thumb ? `url('${big(c.thumb, 120).replace(/'/g, "%27")}')` : "none";
    }
    $("#mini-title").textContent = $("#p-title").textContent = c.title;
    $("#mini-artist").textContent = $("#p-artist").textContent = c.artist || "";
    paused = s.paused;
    syncProgress(s);
    npVid = c.videoId;
    updatePlayButton();
    $("#t-dur").textContent = npDur ? fmt(npDur) : "–:––";
    renderProgress();
  } else {
    npVid = null;
    if (wasPlaying && openSheet === "player") closeSheet();
  }
  markPlaying();
  if (tab === "queue" && !curPl) {
    const sig = JSON.stringify([s.current && s.current.videoId, (s.queue || []).map(t => t.videoId)]);
    if (sig !== lastQueueSig) { lastQueueSig = sig; renderQueue(s); }
  }
}

function setBusy(on) { busy = on; $("#ctrls").classList.toggle("busy", on); updatePlayButton(); }
async function action(path, body, changesTrack) {
  if (busy) return;
  setBusy(true);
  let s;
  try { s = await post(path, body); } catch (e) {}
  if (changesTrack) loadingTrack = true;
  setBusy(false);
  if (s) applyStatus(s);
  if (changesTrack) { loadingTrack = true; updatePlayButton(); }
}
function play(path, body) {
  loadingTrack = true; playing = true; document.body.classList.add("has-mini"); updatePlayButton();
  post(path, body).then(s => { applyStatus(s); loadingTrack = true; updatePlayButton(); }).catch(() => {});
}
async function poll() {
  try { applyStatus(await api("status")); } catch (e) {}
  setTimeout(poll, loadingTrack ? 350 : (document.hidden ? 8000 : 2000));
}

// ---------------------------------------------------------------- account ---
let authMethod = "none", cookie = {};
const authSheet = $("#authSheet");

function rel(iso) {
  if (!iso) return "—";
  const d = new Date(iso), diff = (Date.now() - d) / 1000, abs = Math.abs(diff);
  const r = abs < 90 ? "just now" : abs < 3600 ? Math.round(abs / 60) + " min" : abs < 86400 * 2
    ? Math.round(abs / 3600) + " h" : Math.round(abs / 86400) + " days";
  return abs < 90 ? r : diff > 0 ? r + " ago" : "in " + r;
}
const when = iso => iso ? new Date(iso).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";

async function refreshAuth() {
  try { setAuth(await api("auth/status")); } catch (e) {}
}
function setAuth(s) {
  authMethod = s.method; cookie = s.cookie || {};
  const st = authMethod === "none" ? "none" : (cookie.status || "unknown");
  $("#acctDot").className = "dot " + st;
  if (openSheet === "auth") renderAuth();
}

const howto = open => `<details class="howto" ${open ? "open" : ""}><summary>How to export the cookie</summary><ol>
  <li>Install the “<b>Get cookies.txt LOCALLY</b>” browser extension.</li>
  <li>Open an <b>incognito window</b> → <b>music.youtube.com</b> → sign in.</li>
  <li>Click the extension → <b>Export</b> (current site).</li>
  <li><b>Close incognito without signing out</b>, then upload the file here.</li></ol></details>`;

function renderAuth(msg = "") {
  const connected = authMethod !== "none";
  const st = connected ? (cookie.status || "unknown") : "none";
  const head = {
    ok: ["Connected", `Working · ${cookie.playlists ?? 0} playlists`],
    expired: ["Cookie expired", "Upload a fresh cookie to see your library again."],
    unknown: ["Couldn’t check", cookie.error ? esc(cookie.error).slice(0, 120) : "YouTube didn’t answer — will retry."],
    none: ["Not connected", "Search and playback work; your library needs a cookie."],
  }[st];
  const facts = connected ? `<dl class="facts">
      <dt>Uploaded</dt><dd>${rel(cookie.uploaded_at)}</dd>
      <dt>Last working</dt><dd>${rel(cookie.ok_at)}</dd>
      <dt>Last checked</dt><dd>${rel(cookie.checked_at)}</dd>
      <dt>Next check</dt><dd>${when(cookie.next_check_at)}</dd></dl>` : "";
  authSheet.innerHTML = `<div class="grab"></div><h2>YouTube Music account</h2>
    <div class="status ${st}"><span class="sdot"></span><div><div class="st">${head[0]}</div><div class="ss">${head[1]}</div></div></div>
    ${facts}
    <p id="authMsg">${msg}</p>
    <label class="btn ${connected && st === "ok" ? "" : "primary"}" for="ckfile">${stroke(P.upload, 18)}<span>${connected ? "Replace cookie" : "Upload cookies.txt"}</span></label>
    <input id="ckfile" type="file" accept=".txt,text/plain" style="display:none">
    ${connected ? `<button class="btn" id="checkNow">${stroke(P.refresh, 18)}<span>Check now</span></button>` : ""}
    ${howto(!connected || st === "expired")}
    ${connected ? `<button class="btn danger" id="logout">Remove cookie</button>` : ""}
    <button class="btn ghost" id="closeAuth">Close</button>`;
  $("#ckfile").onchange = uploadCookie;
  $("#closeAuth").onclick = () => closeSheet();
  const cn = $("#checkNow");
  if (cn) cn.onclick = async () => {
    cn.disabled = true; cn.innerHTML = `<span class="spinner" style="width:18px;height:18px;border-width:2px"></span><span>Checking…</span>`;
    try { setAuth(await post("auth/check")); renderAuth(); } catch (e) { renderAuth("Check failed: " + esc(e.message)); }
  };
  const lo = $("#logout");
  if (lo) lo.onclick = async () => { setAuth(await post("auth/logout")); renderAuth(); reload(); };
}
function openAuth() { renderAuth(); showSheet("auth"); refreshAuth(); }
$("#account").onclick = openAuth;

async function uploadCookie(e) {
  const file = e.target.files[0];
  if (!file) return;
  const m = $("#authMsg");
  m.textContent = "Uploading and checking…";
  let r;
  try { r = await (await fetch("/api/cookies", { method: "POST", body: await file.text() })).json(); }
  catch (err) { m.textContent = "Upload failed."; return; }
  if (!r.ok) { m.textContent = "Couldn’t use that: " + (r.error || "rejected"); return; }
  await refreshAuth();
  if (r.authenticated) {
    renderAuth(`Signed in — found ${r.playlists} playlist(s).`);
    setTimeout(() => closeSheet(reload), 1300);
  } else {
    renderAuth("Saved, but this cookie looks signed-out. Re-export while signed in to music.youtube.com.");
  }
}

// ---------------------------------------------------------------- volume ---
const volSheet = $("#volSheet");
const setP = inp => inp.style.setProperty("--p", inp.value + "%");
async function openVol() {
  volSheet.innerHTML = `<div class="grab"></div><h2>Rooms</h2><p>Loading…</p>`;
  showSheet("vol");                    // from the player: swaps in place, same Back entry
  try { renderVol(await api("snapcast/clients")); }
  catch (e) { volSheet.innerHTML = `<div class="grab"></div><h2>Rooms</h2><p>${esc(e.message)}</p><button class="btn ghost" id="volClose">Close</button>`; $("#volClose").onclick = () => closeSheet(); }
}
function renderVol(clients) {
  const on = clients.filter(c => c.connected);
  const avg = on.length ? Math.round(on.reduce((a, c) => a + c.percent, 0) / on.length) : 50;
  let html = `<div class="grab"></div><h2>Rooms</h2>
    <div class="vrow"><span class="vn"><b>All rooms</b></span><input type="range" min="0" max="100" value="${avg}" id="vAll"><span class="vp" id="vAllP">${avg}%</span></div><hr class="sep">`;
  if (!clients.length) html += `<p>No Snapcast clients connected.</p>`;
  clients.forEach((c, i) => {
    html += `<div class="vrow ${c.connected ? "" : "off"}" data-i="${i}"><span class="vn">${esc(c.name)}</span>
      <input type="range" min="0" max="100" value="${c.percent}" ${c.connected ? "" : "disabled"}><span class="vp">${c.percent}%</span></div>`;
  });
  html += `<button class="btn ghost" id="volClose">Done</button>`;
  volSheet.innerHTML = html;
  $("#volClose").onclick = () => closeSheet();
  volSheet.querySelectorAll("input[type=range]").forEach(setP);
  const rows = [...volSheet.querySelectorAll(".vrow[data-i]")], all = $("#vAll");
  all.oninput = () => {
    setP(all); $("#vAllP").textContent = all.value + "%";
    rows.forEach(r => { const inp = r.querySelector("input"); if (!inp.disabled) { inp.value = all.value; setP(inp); r.querySelector(".vp").textContent = all.value + "%"; } });
  };
  all.onchange = () => post("snapcast/volume_all", { percent: +all.value }).catch(() => {});
  rows.forEach(r => {
    const c = clients[+r.dataset.i], inp = r.querySelector("input"), lbl = r.querySelector(".vp");
    inp.oninput = () => { setP(inp); lbl.textContent = inp.value + "%"; };
    inp.onchange = () => post("snapcast/volume", { id: c.id, percent: +inp.value }).catch(() => {});
  });
}

// ---------------------------------------------------------------- boot ---
const authReady = refreshAuth();          // first render waits for it (auth hints)
setInterval(refreshAuth, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAuth(); });
poll();
readUrl();          // globals from the URL first, so writeUrl doesn't clobber ?pl=
writeUrl(false);    // canonicalize: bare / becomes ?tab=search, junk params drop
if (history.state && history.state.sheet) history.replaceState({ seq: history.state.seq }, "", location.search);
syncChrome();
authReady.finally(applyRoute);
</script>
</body>
